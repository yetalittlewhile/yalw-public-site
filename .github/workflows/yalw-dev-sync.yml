name: Website Dev Branch Merge
on:
  push:
    branches:
      - main
jobs:
  job:
    name: Sync main to dev
    runs-on: ubuntu-latest
    permissions:
      contents: 'write'
      id-token: 'write'
      
    steps:
    - name: Checkout dev
      uses: actions/checkout@v4
      with:
        ref: dev.yetalittlewhile.com

    - name: 'Merge and push to origin/main'
      run: |
        git pull -Xtheirs origin main 
        git merge -Xtheirs origin/main
        git push origin dev.yetalittlewhile.com

