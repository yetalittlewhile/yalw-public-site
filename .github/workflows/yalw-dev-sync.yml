name: Website Dev Branch Merge
on:
  push:
    branches:
      - main
jobs:
  job:
    name: Sync main to dev
    runs-on: ubuntu-latest
    permissions:
      contents: 'write'
      id-token: 'write'
      
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
        
    - name: 'Doing the sync'
      run: |
        git config user.name "Arthur Horace Chase"
        git config user.email "arthur-horace-chase@yealittlewhile.com"
        git checkout main
        git pull --all
        git checkout dev.yetalittlewhile.com
        git pull
        git merge main -Xtheirs --allow-unrelated-histories
        git push origin dev.yetalittlewhile.com
