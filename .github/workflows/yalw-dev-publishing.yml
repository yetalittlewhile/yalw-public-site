
## resources
## https://mahendranp.medium.com/gcp-workload-identity-federation-with-github-actions-1d320f62417c
## https://github.com/google-github-actions/setup-gcloud


name: yalw-dev-publishing
permissions:
  id-token: write
  contents: read
on: push
jobs:
  build:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 'Authenticate to Google Cloud'
        id: 'auth'
        uses: 'google-github-actions/auth@v1'
        with:
          workload_identity_provider: 'projects/537021766146/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions'
          service_account: 'seward-bucknam-livermore@yet-a-little-while.iam.gserviceaccount.com'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'        
  
      - name: 'Use gcloud CLI'
        run: 'gcloud storage ls  gs://dev.yetalittlewhile.com'


