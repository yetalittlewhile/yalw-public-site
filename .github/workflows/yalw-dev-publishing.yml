
## resources
## https://www.mickaelvieira.com/blog/2020/01/29/deploying-a-static-website-to-google-cloud-storage-with-github-actions.html
## https://mahendranp.medium.com/gcp-workload-identity-federation-with-github-actions-1d320f62417c
## https://github.com/google-github-actions/setup-gcloud

# .github/workflows/my-workflow.yml
name: Website - Dev
on:
  push:
    branches:
      - main
      - dev.yetalittlewhile.com
jobs:

  build:
    name: Publish Dev
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
    - name: Checkout dev
      uses: actions/checkout@v4
      with:
        ref: dev.yetalittlewhile.com

    - name: Authenticate on GCS
      uses: google-github-actions/auth@v2
      with:
        service_account: '${{ secrets.GCP_SA_EMAIL }}'
        credentials_json: '${{ secrets.GCP_SA_KEY }}'
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: 'who am i anyway?'
      run: 'gcloud auth list --filter=status:ACTIVE --format="value(account)"'

    - name: 'Rsync to gcs'
      run: 'gcloud storage rsync --recursive --delete-unmatched-destination-objects ./src gs://dev.yetalittlewhile.com'



      
